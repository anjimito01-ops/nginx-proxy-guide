services:
  proxy:
    image: nginx:alpine
    container_name: https-proxy
    ports:
      - "443:443"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - frontnet
      - backnet

  backend:
    image: nginx:alpine
    container_name: hello-backend
    volumes:
      - ./backend/index.html:/usr/share/nginx/html/index.html:ro
    expose:
      - "80"
    networks:
      - backnet

networks:
  frontnet:
  backnet:
    internal: true
